name: tests

on:
  push:
    branches: [main]
    tags: ["v[0-9]*", "[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1,16 * *"

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref_type }}-
    ${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      wheel-distribution: ${{ steps.wheel-distribution.outputs.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: setup-python
        with: { python-version: "3.12" }
      - name: Install Poetry
        run: pipx install poetry
      - name: Run static analysis and format checkers
        run: pipx run pre-commit run --all-files --show-diff-on-failure
      - name: Build package distribution files
        run: poetry build
      - name: Verify bundled native libraries
        run: |
          set -euo pipefail
          unzip -l dist/*.whl | grep 'libgsf-x86_64-03.11.so'
          unzip -l dist/*.whl | grep 'libgsf-aarch64-03.11.so'
          tar -tzf dist/*.tar.gz | grep 'libgsf-x86_64-03.11.so'
          tar -tzf dist/*.tar.gz | grep 'libgsf-aarch64-03.11.so'
      - name: Record the path of wheel distribution
        id: wheel-distribution
        run: echo "path=$(ls dist/*.whl)" >> "$GITHUB_OUTPUT"
      - name: Store the distribution files for use in other stages
        uses: actions/upload-artifact@v4
        with:
          name: python-distribution-files
          path: dist/
          retention-days: 1

  test:
    needs: prepare
    strategy:
      matrix:
        python:
          - "3.12"
        platform:
          - ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Retrieve pre-built distribution files
        uses: actions/download-artifact@v4
        with: { name: python-distribution-files, path: dist/ }
      - name: Install package and test dependencies
        run: |
          poetry install --with dev --no-root
          poetry run pip install dist/*.whl
      - name: Run tests
        run: >-
          poetry run pytest -rFEx --durations 10 --color yes
      - name: Generate coverage report
        run: poetry run coverage lcov -o coverage.lcov
      - name: Upload partial coverage report
        uses: coverallsapp/github-action@master
        with:
          path-to-lcov: coverage.lcov
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: ${{ matrix.platform }} - py${{ matrix.python }}
          parallel: true

  finalize:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Finalize coverage report
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true

  publish-to-pypi:
    name: Publish Python distribution to PyPI
    needs:
      - finalize
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && ! endsWith(github.ref, '.dev') }}
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/bluemvmt-gsf

    permissions:
      id-token: write

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-distribution-files
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-testpypi:
    name: Publish Python distribution to TestPyPI
    needs:
      - finalize
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && endsWith(github.ref, '.dev') }}
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/bluemvmt-gsf

    permissions:
      id-token: write

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-distribution-files
          path: dist/
      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
